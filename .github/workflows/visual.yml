name: Visual Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate baselines (uploads as artifact)'
        type: boolean
        default: false

jobs:
  visual:
    name: Playwright visual + a11y
    runs-on: ubuntu-latest
    # Pin the rendering environment. This image ships the exact Playwright
    # version + chromium + fonts, so screenshots are identical here and on any
    # developer machine that runs the same image. Keep this tag in lockstep with
    # `@playwright/test` in website/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      # Browsers + system deps are already in the image; just install node deps.
      - name: Install dependencies
        run: npm ci

      - name: Run visual + a11y suite
        run: |
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            npx playwright test --update-snapshots
          else
            npx playwright test
          fi
        env:
          CI: 'true'
          NOTF_STRICT_OVERFLOW: '1'
          NOTF_STRICT_TAP: '1'

      - name: Upload regenerated snapshots
        if: inputs.update_snapshots == true
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: website/tests/visual/**/*-snapshots/**
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 14

      - name: Upload diff screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: website/test-results
          retention-days: 14
