<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Reset Admin Password - NOTF | NOTF</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/pages/admin-login.css">
</head>
<body>
    <div id="notf-header"></div>
    <script src="/assets/js/components/header.js"></script>
<main>

<section class="admin-login">
    <div class="login-container">
        <div class="login-card">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <i class="fa-solid fa-key" style="font-size: 1.75rem;"></i>
                Set a new password
            </h1>
            <p class="subtitle" id="checking">Checking your reset link…</p>

            <div id="linkProblem" class="error-message" role="alert" hidden>
                <span id="linkProblemText"></span>
                <a href="/admin/login.html?forgot=1">Request a new link</a>
            </div>

            <form id="resetForm" class="login-form" hidden>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Type it again</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" />
                </div>

                <div id="formError" class="error-message" role="alert" hidden></div>

                <button type="submit" class="btn-primary btn-login" id="saveBtn">Save new password</button>
            </form>

            <div class="login-footer">
                <p><a href="/admin/login.html">← Back to sign in</a></p>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/admin/auth.js"></script>
<script>
const MIN_LENGTH = 8;

(async function() {
    const checking = document.getElementById('checking');
    try {
        await authUtils.startPasswordRecovery();
        checking.textContent = 'Choose a password of at least 8 characters.';
        document.getElementById('resetForm').hidden = false;
        document.getElementById('newPassword').focus();
    } catch (error) {
        checking.hidden = true;
        document.getElementById('linkProblemText').textContent =
            `${error.message || 'This reset link is invalid or has expired.'} `;
        document.getElementById('linkProblem').hidden = false;
    }
})();

document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const formError = document.getElementById('formError');
    const saveBtn = document.getElementById('saveBtn');
    const fail = (message) => {
        formError.textContent = message;
        formError.hidden = false;
        saveBtn.disabled = false;
    };

    formError.hidden = true;
    if (password !== confirm) return fail('The two passwords do not match.');
    if (password.length < MIN_LENGTH) return fail(`Use at least ${MIN_LENGTH} characters.`);

    saveBtn.disabled = true;
    try {
        await authUtils.updatePassword(password);
        window.location.href = '/admin/login.html?reset=done';
    } catch (error) {
        fail(error.message || 'Could not save the password. Please try again.');
    }
});
</script>

    </main>

    <div id="notf-footer"></div>
    <script src="/assets/js/components/footer.js"></script>

</body>
</html>
