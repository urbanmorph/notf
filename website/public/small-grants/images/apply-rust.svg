<svg viewBox="-10 -12 250 130" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
/* One shared loop, as on the earlier site: the hand winds up and taps the knob, the knob
   squashes, the pill is nudged left, the three lines pop outward and a ripple spreads. */
.hand,.knob,.core,.ripple{transform-box:fill-box;transform-origin:center}
.hand{animation:hand 2.8s cubic-bezier(.45,0,.25,1) infinite}
.knob{animation:knob 2.8s ease-out infinite}
.core{animation:core 2.8s ease-out infinite}
.pill{animation:pill 2.8s cubic-bezier(.3,1.6,.5,1) infinite}
.ripple{opacity:0;fill:none;stroke:#B5C082;stroke-width:2;animation:ripple 2.8s ease-out infinite}
.spark{animation:2.8s ease-out infinite}
.spark-1{animation-name:spark1}
.spark-2{animation-name:spark2;animation-delay:.05s}
.spark-3{animation-name:spark3;animation-delay:.1s}
@keyframes hand{0%,20%{transform:translate(0,0) rotate(0deg)}34%{transform:translate(4px,5px) rotate(3deg)}42%{transform:translate(-1.5px,-2px) rotate(-1deg)}50%{transform:translate(.5px,.5px)}58%,100%{transform:translate(0,0)}}
@keyframes knob{0%,40%{transform:scale(1)}45%{transform:scale(.9)}55%{transform:scale(1.04)}64%,100%{transform:scale(1)}}
@keyframes core{0%,40%{transform:scale(1)}46%{transform:scale(.78)}58%{transform:scale(1.06)}68%,100%{transform:scale(1)}}
@keyframes pill{0%,42%{transform:translateX(0)}48%{transform:translateX(-3px)}62%,100%{transform:translateX(0)}}
@keyframes ripple{0%,42%{transform:scale(1);opacity:0}44%{opacity:.9}80%,100%{transform:scale(1.3);opacity:0}}
@keyframes spark1{0%,44%{transform:translate(0,0);opacity:1}50%{transform:translate(1px,.15px);opacity:.6}58%{transform:translate(-4px,-.6px);opacity:1}74%,100%{transform:translate(0,0);opacity:1}}
@keyframes spark2{0%,44%{transform:translate(0,0);opacity:1}50%{transform:translate(.8px,.65px);opacity:.6}58%{transform:translate(-3.1px,-2.5px);opacity:1}74%,100%{transform:translate(0,0);opacity:1}}
@keyframes spark3{0%,44%{transform:translate(0,0);opacity:1}50%{transform:translate(.35px,1px);opacity:.6}58%{transform:translate(-1.3px,-3.8px);opacity:1}74%,100%{transform:translate(0,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.hand,.knob,.core,.pill,.ripple,.spark{animation:none}}
</style>
